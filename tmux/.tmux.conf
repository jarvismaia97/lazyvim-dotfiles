# ~/.tmux.conf - Modern Tmux Configuration
# ══════════════════════════════════════════

# ── Basic Settings ──
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"  # True color support
set -s escape-time 10                             # Fast escape (for neovim)
set -g history-limit 10000                        # Scrollback buffer
set -g mouse on                                   # Mouse support
set -g focus-events on                            # Focus events for editors

# Start windows and panes at index 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on  # Renumber windows when one is closed

# ── Key Bindings ──

# Prefix: Ctrl+A (same as WezTerm leader for muscle memory)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config: prefix+r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and - (more intuitive)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Navigate panes with prefix+hjkl (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix+HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with prefix+numbers or prefix+p/n
bind -r p previous-window
bind -r n next-window

# Quick window creation
bind c new-window -c "#{pane_current_path}"

# ── Copy Mode (vi-style) ──
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Easy copy to system clipboard (macOS)
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
}

# Easy copy to system clipboard (Linux with xclip)
if-shell "command -v xclip" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# ── Catppuccin-Inspired Colors (matching nvim/WezTerm) ──

# Catppuccin Mocha palette
CRUST="#11111b"
MANTLE="#181825"
BASE="#1e1e2e"
SURFACE0="#313244"
SURFACE1="#45475a"
SURFACE2="#585b70"
OVERLAY0="#6c7086"
OVERLAY1="#7f849c"
OVERLAY2="#9399b2"
TEXT="#cdd6f4"
BLUE="#89b4fa"
LAVENDER="#b4befe"
SAPPHIRE="#74c7ec"
PEACH="#fab387"
YELLOW="#f9e2af"
GREEN="#a6e3a1"
MAUVE="#cba6f7"
PINK="#f5c2e7"

# Status bar colors
set -g status-style "fg=$TEXT,bg=$SURFACE0"
set -g status-left-style "fg=$BASE,bg=$BLUE,bold"
set -g status-right-style "fg=$TEXT,bg=$SURFACE1"

# Window status colors
set -g window-status-style "fg=$OVERLAY1,bg=$SURFACE0"
set -g window-status-current-style "fg=$BASE,bg=$MAUVE,bold"
set -g window-status-activity-style "fg=$YELLOW,bg=$SURFACE0"

# Pane border colors
set -g pane-border-style "fg=$SURFACE1"
set -g pane-active-border-style "fg=$BLUE"

# Message colors
set -g message-style "fg=$BASE,bg=$YELLOW"
set -g message-command-style "fg=$BASE,bg=$SAPPHIRE"

# Clock colors
set -g clock-mode-colour $BLUE

# ── Status Bar Configuration ──
set -g status on
set -g status-position bottom
set -g status-left-length 50
set -g status-right-length 80
set -g status-interval 5

# Status left: session name with icon
set -g status-left " #[fg=$BASE,bg=$BLUE,bold] #S #[fg=$BLUE,bg=$SURFACE0] "

# Status right: time and date
set -g status-right "#[fg=$SURFACE1,bg=$SURFACE0]#[fg=$TEXT,bg=$SURFACE1] %H:%M #[fg=$BLUE,bg=$SURFACE1]#[fg=$BASE,bg=$BLUE,bold] %d %b "

# Window status format
set -g window-status-format " #[fg=$OVERLAY1]#I:#W "
set -g window-status-current-format " #[fg=$BASE,bg=$MAUVE,bold]#I:#W "

# Window status separator
set -g window-status-separator ""

# ── Plugins (optional - uncomment if using TPM) ──
# List of plugins
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
# run '~/.tmux/plugins/tpm/tpm'

# ── Development Settings ──
# Undercurl support (for LSP diagnostics in neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Better window titles
set -g set-titles on
set -g set-titles-string "#T"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off  # Don't show "Activity in window X" messages

# ── Notes ──
# Key shortcuts reference:
# prefix+|     Split horizontally
# prefix+-     Split vertically  
# prefix+hjkl  Navigate panes
# prefix+HJKL  Resize panes
# prefix+c     New window
# prefix+p/n   Previous/next window
# prefix+r     Reload config
# prefix+[     Copy mode (q to exit)
# prefix+?     Show all key bindings